<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Moodboard — 137 STUDIO</title>
  <!-- Montserrat Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary-blue: #0022FF;
      --glow-blue: rgba(0, 34, 255, 0.4);
      --bg-dark: #0a0c10;
      --panel-bg: rgba(18, 22, 31, 0.85);
      --card-bg: rgba(20, 24, 33, 0.85);
      --border-color: rgba(255, 255, 255, 0.12);
      --text-white: #ffffff;
      --text-muted: #8e9aaf;
      --board-bg: #0b0d12;
      --grid-line-1: rgba(255, 255, 255, 0.07);
      --grid-line-2: rgba(0, 34, 255, 0.05);
      --context-bg: rgba(20, 24, 33, 0.95);
      --modal-bg: rgba(20, 24, 33, 0.9);
      --input-bg: rgba(255, 255, 255, 0.05);
    }

    [data-theme="light"] {
      --primary-blue: #0044FF;
      --glow-blue: rgba(0, 68, 255, 0.25);
      --bg-dark: #f0f2f5;
      --panel-bg: rgba(255, 255, 255, 0.9);
      --card-bg: rgba(255, 255, 255, 0.9);
      --border-color: rgba(0, 0, 0, 0.12);
      --text-white: #1a1d24;
      --text-muted: #64748b;
      --board-bg: #e5e7eb;
      --grid-line-1: rgba(0, 0, 0, 0.06);
      --grid-line-2: rgba(0, 68, 255, 0.04);
      --context-bg: rgba(255, 255, 255, 0.98);
      --modal-bg: rgba(255, 255, 255, 0.95);
      --input-bg: rgba(0, 0, 0, 0.04);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Montserrat', sans-serif;
      -webkit-font-smoothing: antialiased;
      touch-action: manipulation;
    }

    body {
      display: flex;
      height: 100vh;
      height: -webkit-fill-available;
      background-color: var(--bg-dark);
      color: var(--text-white);
      overflow: hidden;
      user-select: none;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    /* SIDEBAR */
    #sidebar {
      width: 320px;
      background: var(--panel-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-right: 1px solid var(--border-color);
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      z-index: 100;
      box-shadow: 10px 0 30px rgba(0,0,0,0.1);
      overflow-y: auto;
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
    }

    @media (max-width: 768px) {
      #sidebar {
        position: fixed;
        left: 0;
        top: 0;
        bottom: 0;
        z-index: 1000;
        transform: translateX(-100%);
        width: 280px;
      }

      #sidebar.active {
        transform: translateX(0);
      }
    }

    .sidebar-toggle-btn {
      position: absolute;
      top: 20px;
      right: -40px;
      width: 36px;
      height: 36px;
      background: var(--primary-blue);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 1001;
      box-shadow: 0 4px 15px var(--glow-blue);
    }

    .brand-section {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .brand-logo h1 {
      font-weight: 800;
      font-size: 1.4rem;
      color: var(--text-white);
    }

    .brand-badge {
      font-size: 0.6rem;
      font-weight: 700;
      letter-spacing: 2px;
      color: var(--primary-blue);
      text-transform: uppercase;
      background: rgba(0, 34, 255, 0.12);
      border: 1px solid rgba(0, 34, 255, 0.3);
      padding: 3px 8px;
      border-radius: 20px;
      width: fit-content;
    }

    .theme-toggle-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--input-bg);
      border: 1px solid var(--border-color);
      padding: 8px 12px;
      border-radius: 8px;
    }

    .theme-switch-btn {
      background: var(--primary-blue);
      color: #fff;
      border: none;
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 0.7rem;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-add {
      width: 100%;
      padding: 12px;
      background: var(--primary-blue);
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 4px 15px var(--glow-blue);
    }

    .boards-depot {
      margin-top: 15px;
      border-top: 1px solid var(--border-color);
      padding-top: 14px;
    }

    .boards-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 140px;
      overflow-y: auto;
    }

    .board-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px;
      background: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 0.75rem;
      cursor: pointer;
    }

    .board-item.active {
      background: var(--primary-blue) !important;
      color: #fff !important;
    }

    /* PANO (BOARD) */
    #board-container {
      flex: 1;
      position: relative;
      overflow: hidden;
      background-color: var(--board-bg);
      background-image: 
        linear-gradient(var(--grid-line-1) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid-line-1) 1px, transparent 1px);
      background-size: 25px 25px;
      touch-action: none;
    }

    #selection-box {
      position: absolute;
      border: 1px dashed var(--primary-blue);
      background: rgba(0, 34, 255, 0.15);
      pointer-events: none;
      z-index: 999;
      display: none;
    }

    .board-header {
      position: absolute;
      top: 15px;
      right: 15px;
      display: flex;
      align-items: center;
      gap: 15px;
      z-index: 5;
      background: var(--panel-bg);
      backdrop-filter: blur(10px);
      padding: 8px 14px;
      border-radius: 20px;
      border: 1px solid var(--border-color);
    }

    .text-link-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: underline;
    }

    /* KART / KATMAN YAPISI */
    .card {
      position: absolute;
      min-width: 180px;
      min-height: 120px;
      background: var(--card-bg);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      cursor: grab;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      touch-action: none;
    }

    /* Klasör efekti için görsel gölgelendirme */
    .card.grouped {
      box-shadow: -4px 6px 15px rgba(0, 0, 0, 0.4), 0 0 10px var(--glow-blue);
      border-color: rgba(0, 34, 255, 0.5) !important;
    }

    .card.selected {
      border-color: var(--primary-blue) !important;
      box-shadow: 0 0 20px var(--glow-blue) !important;
    }

    /* Resizer tutamacı (Mobil & Masaüstü) */
    .resizer {
      width: 16px;
      height: 16px;
      position: absolute;
      right: 0;
      bottom: 0;
      cursor: nwse-resize;
      z-index: 10;
      touch-action: none;
    }

    .resizer::after {
      content: '';
      position: absolute;
      right: 4px;
      bottom: 4px;
      width: 6px;
      height: 6px;
      border-right: 2px solid var(--text-muted);
      border-bottom: 2px solid var(--text-muted);
    }

    .card-top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .card-tag {
      font-size: 0.55rem;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      text-transform: uppercase;
    }

    .tag-video { background: rgba(255, 71, 87, 0.15); color: #ff4757; }
    .tag-design { background: rgba(46, 213, 115, 0.15); color: #2ed573; }
    .tag-photo { background: rgba(30, 144, 255, 0.15); color: #1e90ff; }
    .tag-text { background: rgba(128, 128, 128, 0.15); color: var(--text-white); }

    .brand-tag {
      font-size: 0.55rem;
      font-weight: 700;
      color: var(--text-white);
      background: var(--input-bg);
      padding: 2px 5px;
      border-radius: 4px;
      border: 1px solid var(--border-color);
    }

    .card-img-wrapper {
      flex: 1;
      width: 100%;
      min-height: 70px;
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 6px;
      background: var(--input-bg);
      pointer-events: none;
    }

    .card-img-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card h4 {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-white);
      margin-bottom: 4px;
      pointer-events: none;
    }

    .card-delete {
      width: 18px;
      height: 18px;
      background: var(--input-bg);
      border-radius: 50%;
      color: var(--text-muted);
      font-size: 0.6rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    /* MODAL */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(10px);
      z-index: 2000;
      display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .modal-overlay.active {
      opacity: 1; pointer-events: auto;
    }

    .glass-modal {
      width: 90%; max-width: 400px;
      background: var(--modal-bg);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 20px;
      display: flex; flex-direction: column; gap: 12px;
    }

    /* CONTEXT MENU */
    #context-menu {
      position: absolute;
      z-index: 3000;
      width: 180px;
      background: var(--context-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 6px 0;
      display: none;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    .context-menu-item {
      padding: 8px 12px;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-white);
      cursor: pointer;
    }

    .context-menu-item:hover {
      background: var(--primary-blue);
    }
  </style>
</head>
<body data-theme="dark">

  <!-- SIDEBAR -->
  <aside id="sidebar">
    <button class="sidebar-toggle-btn" onclick="toggleSidebar()">◀</button>
    <div class="brand-section">
      <div>
        <div class="brand-badge">Creative Canvas</div>
        <div class="brand-logo" style="margin-top: 4px;">
          <h1>137studio</h1>
        </div>
      </div>

      <div class="theme-toggle-container">
        <span style="font-size: 0.7rem; font-weight:700;">Görünüm Modu</span>
        <button class="theme-switch-btn" id="themeBtn" onclick="toggleTheme()">🌙 Dark</button>
      </div>

      <button class="btn-add" onclick="openCreateModal()">+ Yeni Referans Ekle</button>

      <div class="boards-depot">
        <div style="display:flex; justify-content:space-between; margin-bottom:8px;">
          <span style="font-size:0.65rem; color:var(--text-muted); font-weight:700;">MOODBOARDLAR</span>
          <button class="text-link-btn" onclick="saveCurrentBoard()">+ Kaydet</button>
        </div>
        <div class="boards-list" id="boardsList"></div>
      </div>
    </div>
  </aside>

  <!-- PANO / BOARD -->
  <main id="board-container">
    <div id="selection-box"></div>
    <div class="board-header">
      <a href="https://mrorbay.github.io/137-Studio-s-takip/" class="text-link-btn">İş Takibine Dön</a>
      <button class="text-link-btn" onclick="clearBoard()">Panoyu Temizle</button>
    </div>
  </main>

  <!-- SAĞ TIK / MOBİL MENÜ -->
  <div id="context-menu">
    <div class="context-menu-item" onclick="contextAddText()">📝 Metin Ekle</div>
    <div class="context-menu-item" onclick="contextAddCard()">🖼️ Kart Ekle</div>
    <div class="context-menu-item" id="menu-group-btn" style="display:none;" onclick="contextToggleGroup()">📁 Klasör Gibi Grupla</div>
  </div>

  <!-- MODAL -->
  <div class="modal-overlay" id="glassModal">
    <div class="glass-modal">
      <h3 style="font-size:0.9rem;" id="modalTitle">Kart Oluştur / Düzenle</h3>
      <input type="hidden" id="modalCardId">
      <input type="hidden" id="modalType" value="link">

      <input type="text" id="modalBrand" placeholder="Marka (Örn: Coffeetainer)" style="padding:8px; background:var(--input-bg); border:1px solid var(--border-color); color:#fff; border-radius:6px;">
      
      <select id="modalCategory" style="padding:8px; background:var(--input-bg); border:1px solid var(--border-color); color:#fff; border-radius:6px;">
        <option value="video">Video Fikri</option>
        <option value="design">Tasarım Fikri</option>
        <option value="photo">Fotoğraf Fikri</option>
      </select>

      <textarea id="modalCardTitle" rows="3" placeholder="Fikir Başlığı / Metin Notu" style="padding:8px; background:var(--input-bg); border:1px solid var(--border-color); color:#fff; border-radius:6px;"></textarea>
      
      <input type="text" id="modalTargetUrl" placeholder="Link URL (https://...)" style="padding:8px; background:var(--input-bg); border:1px solid var(--border-color); color:#fff; border-radius:6px;">
      <input type="text" id="modalImageUrl" placeholder="Görsel URL (Boşsa otomatiktir)" style="padding:8px; background:var(--input-bg); border:1px solid var(--border-color); color:#fff; border-radius:6px;">

      <div style="display:flex; justify-content:flex-end; gap:8px;">
        <button onclick="closeModal()" style="padding:8px 12px; background:none; border:none; color:var(--text-muted); font-size:0.75rem;">İptal</button>
        <button onclick="saveModalData()" style="padding:8px 12px; background:var(--primary-blue); border:none; color:#fff; border-radius:6px; font-size:0.75rem; font-weight:700;">Kaydet</button>
      </div>
    </div>
  </div>

  <!-- HYBRID FIREBASE ENGINE & HYBRID EVENT HANDLING -->
  <script type="module">
    let db = null, setRef = null, dbRef = null;

    const firebaseConfig = {
      apiKey: "AIzaSyD82U3cY-PPXzTC-Wt_EOIZvgfdswqTfT4",
      authDomain: "studio-574ce.firebaseapp.com",
      databaseURL: "https://studio-574ce-default-rtdb.firebaseio.com",
      projectId: "studio-574ce",
      storageBucket: "studio-574ce.firebasestorage.app",
      messagingSenderId: "861579196989",
      appId: "1:861579196989:web:7fec2452747347c1d84854"
    };

    async function initFirebase() {
      try {
        const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js");
        const { getDatabase, ref, set, onValue } = await import("https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js");

        const app = initializeApp(firebaseConfig);
        db = getDatabase(app);
        setRef = set; dbRef = ref;

        onValue(ref(db, 'boards'), (snapshot) => {
          const data = snapshot.val();
          if (data) {
            window.savedBoards = data;
            localStorage.setItem('137_saved_boards', JSON.stringify(window.savedBoards));
            if (!window.savedBoards[window.currentBoardName]) {
              window.currentBoardName = Object.keys(window.savedBoards)[0] || 'Varsayılan Pano';
            }
            window.cardsData = JSON.parse(JSON.stringify(window.savedBoards[window.currentBoardName] || []));
            renderBoardsList();
            renderCards();
          }
        });
      } catch (err) {
        console.warn("Offline moddasınız.");
      }
    }

    window.savedBoards = JSON.parse(localStorage.getItem('137_saved_boards')) || {};
    window.currentBoardName = localStorage.getItem('137_active_board_name') || 'Varsayılan Pano';
    window.cardsData = [];
    window.selectedCardIds = [];
    window.highestZIndex = 10;
    window.rightClickPos = { x: 100, y: 100 };

    window.saveAllToStorage = function() {
      window.savedBoards[window.currentBoardName] = JSON.parse(JSON.stringify(window.cardsData));
      localStorage.setItem('137_saved_boards', JSON.stringify(window.savedBoards));
      localStorage.setItem('137_active_board_name', window.currentBoardName);

      if (navigator.onLine && db && setRef && dbRef) {
        setRef(dbRef(db, 'boards'), window.savedBoards);
      }
    };

    window.onload = () => {
      if (Object.keys(window.savedBoards).length === 0) {
        window.cardsData = [
          { id: 1, type: 'link', brand: 'Coffeetainer', category: 'design', title: 'Sosyal Medya UI Referansı', img: 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=500', url: 'https://pinterest.com', x: 50, y: 50, w: 220, h: 220, zIndex: 1, groupId: null },
          { id: 2, type: 'text', brand: 'Genel', category: 'text', title: 'Kampanya Tasarım Notları', textColor: '#0022FF', x: 50, y: 300, w: 220, h: 140, zIndex: 2, groupId: null }
        ];
        window.savedBoards[window.currentBoardName] = window.cardsData;
        window.saveAllToStorage();
      } else {
        window.cardsData = JSON.parse(JSON.stringify(window.savedBoards[window.currentBoardName] || []));
      }

      renderBoardsList();
      renderCards();
      setupContextMenu();

      if (navigator.onLine) initFirebase();
    };

    // --- TEMA VE SIDEBAR ---
    window.toggleTheme = function() {
      const cur = document.body.getAttribute('data-theme');
      const next = cur === 'light' ? 'dark' : 'light';
      document.body.setAttribute('data-theme', next);
      document.getElementById('themeBtn').innerText = next === 'light' ? '☀️ Light' : '🌙 Dark';
    };

    window.toggleSidebar = function() {
      document.getElementById('sidebar').classList.toggle('active');
    };

    window.saveCurrentBoard = function() {
      const name = prompt('Pano ismi:', window.currentBoardName);
      if (name) {
        window.currentBoardName = name.trim();
        window.saveAllToStorage();
        renderBoardsList();
      }
    };

    function renderBoardsList() {
      const listEl = document.getElementById('boardsList');
      listEl.innerHTML = '';
      Object.keys(window.savedBoards).forEach(bName => {
        const item = document.createElement('div');
        item.className = `board-item ${bName === window.currentBoardName ? 'active' : ''}`;
        item.innerText = bName;
        item.onclick = () => {
          window.currentBoardName = bName;
          window.cardsData = JSON.parse(JSON.stringify(window.savedBoards[bName]));
          window.saveAllToStorage();
          renderBoardsList();
          renderCards();
        };
        listEl.appendChild(item);
      });
    }

    // --- KARTLARI ÇİZME VE ETKİLEŞİM ---
    window.renderCards = function() {
      const container = document.getElementById('board-container');
      document.querySelectorAll('.card').forEach(el => el.remove());

      window.cardsData.forEach(card => {
        const cardEl = document.createElement('div');
        cardEl.className = `card ${card.groupId ? 'grouped' : ''} ${window.selectedCardIds.includes(card.id) ? 'selected' : ''}`;
        cardEl.style.left = `${card.x}px`;
        cardEl.style.top = `${card.y}px`;
        cardEl.style.width = `${card.w || 200}px`;
        cardEl.style.height = `${card.h || 180}px`;
        cardEl.style.zIndex = card.zIndex || 1;
        cardEl.dataset.id = card.id;

        const catMap = { video: 'Video', design: 'Tasarım', photo: 'Fotoğraf', text: 'Metin' };

        cardEl.innerHTML = `
          <div class="card-top-bar">
            <span class="card-tag tag-${card.category}">${catMap[card.category] || 'Metin'}</span>
            <div style="display:flex; align-items:center; gap:4px;">
              <span class="brand-tag">${card.brand || 'Genel'}</span>
              <div class="card-delete" onclick="deleteCard(${card.id}, event)">✕</div>
            </div>
          </div>
          ${card.img ? `<div class="card-img-wrapper"><img src="${card.img}"></div>` : ''}
          <h4>${card.title}</h4>
          <div class="resizer"></div>
        `;

        makeInteractive(cardEl, card);
        container.appendChild(cardEl);
      });
    };

    // --- INTERACTIVE (SÜRÜKLE & BÜYÜT - MOBİL & MASAÜSTÜ) ---
    function makeInteractive(el, data) {
      let isDragging = false, isResizing = false;
      let startX, startY, initialW, initialH;
      let groupInitialPositions = [];

      // Dokunmatik & Fare Başlangıcı
      function onStart(e) {
        if (e.target.classList.contains('card-delete')) return;

        const pageX = e.touches ? e.touches[0].clientX : e.clientX;
        const pageY = e.touches ? e.touches[0].clientY : e.clientY;

        // Katman Öne Çıkarma
        window.highestZIndex++;
        data.zIndex = window.highestZIndex;
        el.style.zIndex = data.zIndex;

        // Büyütme (Resizing) Kontrolü
        if (e.target.classList.contains('resizer')) {
          isResizing = true;
          startX = pageX;
          startY = pageY;
          initialW = el.offsetWidth;
          initialH = el.offsetHeight;
          e.stopPropagation();
          return;
        }

        // Seçim mantığı
        if (!window.selectedCardIds.includes(data.id)) {
          if (!e.shiftKey) window.selectedCardIds = [data.id];
          else window.selectedCardIds.push(data.id);
        }

        // Eğer gruplanmışsa, grubun tüm üyelerini seç
        if (data.groupId) {
          const gMembers = window.cardsData.filter(c => c.groupId === data.groupId).map(c => c.id);
          window.selectedCardIds = [...new Set([...window.selectedCardIds, ...gMembers])];
        }

        renderCards();

        // Gruptaki / Seçilen tüm kartların başlangıç pozisyonlarını kaydet
        isDragging = true;
        startX = pageX;
        startY = pageY;

        groupInitialPositions = window.selectedCardIds.map(id => {
          const c = window.cardsData.find(item => item.id === id);
          return { id, x: c.x, y: c.y };
        });
      }

      function onMove(e) {
        if (!isDragging && !isResizing) return;

        const pageX = e.touches ? e.touches[0].clientX : e.clientX;
        const pageY = e.touches ? e.touches[0].clientY : e.clientY;

        const dx = pageX - startX;
        const dy = pageY - startY;

        if (isResizing) {
          const newW = Math.max(160, initialW + dx);
          const newH = Math.max(100, initialH + dy);
          el.style.width = `${newW}px`;
          el.style.height = `${newH}px`;
          data.w = newW;
          data.h = newH;
        } else if (isDragging) {
          groupInitialPositions.forEach(pos => {
            const cardObj = window.cardsData.find(item => item.id === pos.id);
            if (cardObj) {
              cardObj.x = pos.x + dx;
              cardObj.y = pos.y + dy;
              const cardElement = document.querySelector(`.card[data-id="${pos.id}"]`);
              if (cardElement) {
                cardElement.style.left = `${cardObj.x}px`;
                cardElement.style.top = `${cardObj.y}px`;
              }
            }
          });
        }
      }

      function onEnd() {
        if (isDragging || isResizing) {
          isDragging = false;
          isResizing = false;
          window.saveAllToStorage();
        }
      }

      el.addEventListener('mousedown', onStart);
      el.addEventListener('touchstart', onStart, { passive: false });

      window.addEventListener('mousemove', onMove);
      window.addEventListener('touchmove', onMove, { passive: false });

      window.addEventListener('mouseup', onEnd);
      window.addEventListener('touchend', onEnd);
    }

    // --- KLASÖR GİBİ KATMANLI GRUPLAMA (CASCADE EFFECT) ---
    window.contextToggleGroup = function() {
      if (window.selectedCardIds.length < 2) return;

      const selectedObjects = window.cardsData.filter(c => window.selectedCardIds.includes(c.id));
      const firstGroup = selectedObjects[0].groupId;
      const isAllSameGroup = firstGroup && selectedObjects.every(c => c.groupId === firstGroup);

      if (isAllSameGroup) {
        // Grubu Çöz
        selectedObjects.forEach(c => c.groupId = null);
      } else {
        // KLASÖR KATMANI OLUŞTUR (CASCADE)
        const newGroupId = 'group_' + Date.now();
        
        // İlk seçilen kartı referans kök al
        const rootX = selectedObjects[0].x;
        const rootY = selectedObjects[0].y;

        selectedObjects.forEach((card, index) => {
          card.groupId = newGroupId;
          // Klasör gibi 15px sağa, 15px aşağıya katmanlı sırala
          card.x = rootX + (index * 15);
          card.y = rootY + (index * 15);
          card.zIndex = window.highestZIndex + index;
        });

        window.highestZIndex += selectedObjects.length;
      }

      window.saveAllToStorage();
      renderCards();
    };

    // --- SAĞ TIK & MOBİL UZUN BASMA MENÜSÜ ---
    function setupContextMenu() {
      const board = document.getElementById('board-container');
      const menu = document.getElementById('context-menu');

      function openMenu(x, y) {
        window.rightClickPos = { x, y };
        menu.style.left = `${x}px`;
        menu.style.top = `${y}px`;

        const groupBtn = document.getElementById('menu-group-btn');
        if (window.selectedCardIds.length > 1) {
          groupBtn.style.display = 'block';
        } else {
          groupBtn.style.display = 'none';
        }
        menu.style.display = 'block';
      }

      board.addEventListener('contextmenu', (e) => {
        e.preventDefault();
        openMenu(e.clientX, e.clientY);
      });

      document.addEventListener('click', () => menu.style.display = 'none');
    }

    window.deleteCard = function(id, e) {
      if (e) e.stopPropagation();
      window.cardsData = window.cardsData.filter(c => c.id !== id);
      window.selectedCardIds = window.selectedCardIds.filter(sId => sId !== id);
      window.saveAllToStorage();
      renderCards();
    };

    window.clearBoard = function() {
      if (confirm('Mevcut panoyu temizlemek istediğinize emin misiniz?')) {
        window.cardsData = [];
        window.selectedCardIds = [];
        window.saveAllToStorage();
        renderCards();
      }
    };

    window.openCreateModal = function() {
      document.getElementById('glassModal').classList.add('active');
    };

    window.closeModal = function() {
      document.getElementById('glassModal').classList.remove('active');
    };

    window.saveModalData = function() {
      const brand = document.getElementById('modalBrand').value || 'Genel';
      const title = document.getElementById('modalCardTitle').value || 'Referans Notu';
      const category = document.getElementById('modalCategory').value;
      const url = document.getElementById('modalTargetUrl').value;
      const img = document.getElementById('modalImageUrl').value || (url ? `https://api.microlink.io/?url=${encodeURIComponent(url)}&embed=image.url` : 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=500');

      window.cardsData.push({
        id: Date.now(),
        type: 'link',
        brand, category, title, img, url,
        x: 60, y: 60, w: 220, h: 220,
        zIndex: ++window.highestZIndex,
        groupId: null
      });

      window.saveAllToStorage();
      renderCards();
      closeModal();
    };

    window.contextAddText = function() {
      window.cardsData.push({
        id: Date.now(),
        type: 'text',
        brand: 'Not', category: 'text',
        title: 'Yeni Not...',
        x: window.rightClickPos.x, y: window.rightClickPos.y,
        w: 200, h: 120,
        zIndex: ++window.highestZIndex,
        groupId: null
      });
      window.saveAllToStorage();
      renderCards();
    };

    window.contextAddCard = function() { window.openCreateModal(); };
  </script>
</body>
</html>
